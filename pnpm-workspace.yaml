allowBuilds:
  msw: false
  sharp: true
  unrs-resolver: false

overrides:
  '@hono/node-server': '^1.19.13'
  '@isaacs/brace-expansion': '^5.0.1'
  '@modelcontextprotocol/sdk': '^1.29.0'
  # Pinned per major line: forcing one major on every consumer breaks the ones that need another
  # (minimatch 3 needs brace-expansion 1.x, so a global ^5 crashed eslint).
  'brace-expansion@^1': '^1.1.21'
  'brace-expansion@^5': '^5.0.6'
  'fast-uri': '^3.1.2'
  'hono': '^4.12.23'
  'lodash': '^4.18.1'
  'path-to-regexp@^6': '^6.3.0'
  'path-to-regexp@^8': '^8.4.2'
  'picomatch@^2': '^2.3.2'
  'picomatch@^4': '^4.0.4'
  'postcss': '^8.5.10'
  'protocol-buffers-schema': '^3.6.1'
  'qs': '^6.15.2'
  'undici': '^7.26.0'
  'flatted': '^3.4.2'
